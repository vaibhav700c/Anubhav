# Render Blueprint for the Anubhav FastAPI hub.
#
# This only prepares the repo for deployment - it does not deploy anything
# by itself. To actually go live:
#   1. Push this file to the repo (already done if you're reading it there).
#   2. In the Render dashboard: New -> Blueprint -> connect this GitHub repo.
#   3. Render reads this file and provisions the service AND the database
#      below automatically.
#   4. Add SARVAM_API_KEY / HUME_API_KEY as secret env vars in the Render
#      dashboard if/when you want real (non-mock) Sarvam/Hume calls - never
#      commit them here.
#
# DATABASE_URL now points at the managed Postgres instance declared below
# instead of the free web service's own disk. That disk is ephemeral (wiped
# on every deploy and on spin-down after idling) - real sessions were being
# saved correctly and then erased by the very next redeploy, which is what
# looked like "the DB never gets updated." Postgres survives both. Render's
# free Postgres plan has its own limits/expiry (check the current terms in
# your dashboard - they change over time) - upgrade the `plan` below if you
# need it to persist past that.
databases:
  - name: anubhav-db
    plan: free
    databaseName: anubhav
    user: anubhav

services:
  - type: web
    name: anubhav-hub
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MOCK_MODE
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: anubhav-db
          property: connectionString
      # SARVAM_API_KEY / HUME_API_KEY / HUME_SECRET_KEY are set as secret env
      # vars directly in the Render dashboard (never committed here). Render
      # Blueprint syncs re-assert every value listed in this file on deploy,
      # which is exactly why MOCK_MODE was silently forcing itself back to
      # "true" on every redeploy even after setting real keys in the
      # dashboard - it's the source of truth now, not a placeholder.
