# Render Blueprint for the Anubhav FastAPI hub.
#
# This only prepares the repo for deployment - it does not deploy anything
# by itself. To actually go live:
#   1. Push this file to the repo (already done if you're reading it there).
#   2. In the Render dashboard: New -> Blueprint -> connect this GitHub repo.
#   3. Render reads this file and provisions the service below automatically.
#   4. Add SARVAM_API_KEY / HUME_API_KEY as secret env vars in the Render
#      dashboard if/when you want real (non-mock) Sarvam/Hume calls - never
#      commit them here.
#
# Note: the free tier's disk is ephemeral, so the SQLite database
# (anubhav.db) resets on every deploy and on spin-down after idling. That's
# fine for a demo; for anything persistent, switch DATABASE_URL to a
# Render-managed Postgres instance instead.
services:
  - type: web
    name: anubhav-hub
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MOCK_MODE
        value: "true"
      - key: ENVIRONMENT
        value: "production"
      - key: PYTHON_VERSION
        value: "3.11.9"
